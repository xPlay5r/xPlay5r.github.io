<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Words - Module 2A</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .mode-btn {
            padding: 12px 24px;
            background-color: #5a8dee;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .mode-btn:hover {
            background-color: #4a7de0;
        }

        .mode-btn.active {
            background-color: #3a6dd0;
        }

        .content {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        /* Flashcard Styles */
        .flashcard-container {
            perspective: 800px;
            margin-bottom: 20px;
            height: 300px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .flashcard-front {
            background-color: #e8f4fc;
            color: #2c3e50;
        }

        .flashcard-back {
            background-color: #f0f7ff;
            color: #2c3e50;
            transform: rotateY(180deg);
            text-align: center;
        }

        .word {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .translation {
            font-size: 28px;
            color: #3a6dd0;
            margin-bottom: 10px;
        }

        .transcription {
            font-size: 18px;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        .example {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
            font-style: italic;
            text-align: center;
        }

        .additional-translations {
            margin-top: 15px;
            font-size: 14px;
            color: #777;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: #5a8dee;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .nav-btn:hover {
            background-color: #4a7de0;
        }

        .nav-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .progress {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }

        /* Test Styles */
        .test-container {
            display: none;
        }

        .question {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option {
            padding: 15px;
            background-color: #f0f7ff;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .option:hover {
            border-color: #5a8dee;
            background-color: #e8f4fc;
        }

        .option.selected {
            border-color: #5a8dee;
            background-color: #d4e6ff;
        }

        .option.correct {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }

        .option.incorrect {
            border-color: #f44336;
            background-color: #ffebee;
        }

        .test-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            display: none;
        }

        .highlight {
            font-weight: bold;
            color: #3a6dd0;
        }

        /* Matching game styles */
        .matching-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .definitions, .words {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .definition-item, .word-item {
            padding: 15px;
            background-color: #f0f7ff;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .definition-item:hover, .word-item:hover {
            border-color: #5a8dee;
            background-color: #e8f4fc;
        }

        .definition-item.selected, .word-item.selected {
            border-color: #5a8dee;
            background-color: #d4e6ff;
        }

        .definition-item.matched, .word-item.matched {
            border-color: #4CAF50;
            background-color: #e8f5e9;
            cursor: default;
        }

        .context-question {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .context-sentence {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-style: italic;
            border-left: 4px solid #5a8dee;
        }

        @media (max-width: 768px) {
            .options {
                grid-template-columns: 1fr;
            }
            
            .matching-container {
                grid-template-columns: 1fr;
            }
            
            .flashcard-container {
                height: 250px;
            }
            
            .word {
                font-size: 28px;
            }
            
            .translation {
                font-size: 24px;
            }
            
            .flashcard-front, .flashcard-back {
                padding: 15px;
            }
            
            .mode-btn {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

    </div>

            showFlashcard();

        // Set up event listeners

            // Mode switching
            flashcardBtn.addEventListener('click', () => switchMode('flashcards'));
            testBtn.addEventListener('click', () => switchMode('test'));
            matchingBtn.addEventListener('click', () => switchMode('matching'));
            contextBtn.addEventListener('click', () => switchMode('context'));

            prevBtn.addEventListener('click', showPreviousCard);
            nextBtn.addEventListener('click', showNextCard);

            // Test controls

            nextTestBtn.addEventListener('click', nextQuestion);

            // Matching game controls
            checkMatchingBtn.addEventListener('click', checkMatching);
            nextMatchingBtn.addEventListener('click', nextMatchingSet);

            // Context test controls
            checkContextBtn.addEventListener('click', checkContextAnswer);
            nextContextBtn.addEventListener('click', nextContextQuestion);
        }

        // Switch between modes
        function switchMode(mode) {
            // Hide all containers
            flashcardMode.style.display = 'none';
            testContainer.style.display = 'none';
            matchingContainer.style.display = 'none';
            contextContainer.style.display = 'none';
            
            // Remove active class from all buttons
            flashcardBtn.classList.remove('active');
            testBtn.classList.remove('active');
            matchingBtn.classList.remove('active');
            contextBtn.classList.remove('active');
            
            // Show selected container and set active button
            switch(mode) {
                case 'flashcards':
                    flashcardMode.style.display = 'block';
                    flashcardBtn.classList.add('active');
                    break;
                case 'test':
                    testContainer.style.display = 'block';
                    testBtn.classList.add('active');
                    startTest();
                    break;
                case 'matching':
                    matchingContainer.style.display = 'block';
                    matchingBtn.classList.add('active');
                    startMatchingGame();
                    break;
                case 'context':
                    contextContainer.style.display = 'block';
                    contextBtn.classList.add('active');
                    startContextTest();
                    break;
            }

        // Flashcard functions
        function showFlashcard() {
            const currentWord = words[currentCardIndex];
            
            // Update content immediately without animation
            wordFront.textContent = currentWord.russian;
            wordBack.innerHTML = `<span class="highlight">${currentWord.english}</span>`;
            transcription.textContent = currentWord.transcription;
            example.textContent = currentWord.example;
            additionalTranslations.innerHTML = `Also: <span class="highlight">${currentWord.additional}</span>`;
            
            // Reset card to front immediately without animation
            flashcard.style.transition = 'none';
            flashcard.classList.remove('flipped');
            isFlipped = false;
            
            // Force reflow to apply changes immediately
            flashcard.offsetHeight;
            
            // Restore animation
            flashcard.style.transition = 'transform 0.5s ease';
            
            updateProgress();
        }

        function flipCard() {
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function showPreviousCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                showFlashcard();
            }
        }

        function showNextCard() {
            if (currentCardIndex < words.length - 1) {
                currentCardIndex++;
                showFlashcard();
            }
        }

        function updateProgress() {
            progress.textContent = `${currentCardIndex + 1} / ${words.length}`;
        }

        // Translation Test functions
        function startTest() {
            testWords = [...words];
            shuffleArray(testWords);
            currentTestIndex = 0;
            score = 0;
            nextQuestion();
        }

        function nextQuestion() {
            if (currentTestIndex >= testWords.length) {
                showTestResults();
                return;
            }

            const currentWord = testWords[currentTestIndex];
            question.innerHTML = `What is the English translation of <span class="highlight">"${currentWord.russian}"</span>?`;
            
            // Generate options (1 correct + 3 random incorrect)
            const optionsArray = [currentWord.english];
            while (optionsArray.length < 4) {
                const randomWord = words[Math.floor(Math.random() * words.length)];
                if (!optionsArray.includes(randomWord.english)) {
                    optionsArray.push(randomWord.english);
                }
            }
            shuffleArray(optionsArray);
            
            // Display options
            options.innerHTML = '';
            optionsArray.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.textContent = option;
                optionElement.addEventListener('click', () => selectOption(optionElement, optionsArray));
                options.appendChild(optionElement);
            });
            
            // Reset UI
            selectedOption = null;
            result.style.display = 'none';
            checkBtn.disabled = false;
            nextTestBtn.disabled = true;
        }

        function selectOption(optionElement, optionsArray) {
            // Deselect all options
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Select clicked option
            optionElement.classList.add('selected');
            selectedOption = optionElement.textContent;
        }

        function checkAnswer() {
            if (!selectedOption) return;
            
            const currentWord = testWords[currentTestIndex];
            const isCorrect = selectedOption === currentWord.english;
            
            // Show correct/incorrect
            document.querySelectorAll('.option').forEach(opt => {
                if (opt.textContent === currentWord.english) {
                    opt.classList.add('correct');
                } else if (opt.textContent === selectedOption && !isCorrect) {
                    opt.classList.add('incorrect');
                }
                opt.style.pointerEvents = 'none';
            });
            
            // Update score
            if (isCorrect) {
                score++;
                result.textContent = "Correct!";
                result.style.color = "#4CAF50";
            } else {
                result.textContent = `Incorrect! The right answer is "${currentWord.english}".`;
                result.style.color = "#f44336";
            }
            
            result.style.display = 'block';
            checkBtn.disabled = true;
            nextTestBtn.disabled = false;
            currentTestIndex++;
        }

        function showTestResults() {
            question.textContent = "Test Completed!";
            options.innerHTML = '';
            result.textContent = `Your score: ${score} out of ${testWords.length}`;
            result.style.color = "#2c3e50";
            result.style.display = 'block';
            checkBtn.style.display = 'none';
            nextTestBtn.textContent = 'Restart Test';
            nextTestBtn.onclick = () => {
                startTest();
                checkBtn.style.display = 'block';
                nextTestBtn.textContent = 'Next Question';
            };
        }

        // Matching Game functions
        function startMatchingGame() {
            currentMatchingSet = getRandomWords(6); // Берем 6 случайных слов
            matchedPairs = 0;
            setupMatchingGame();
        }

        function getRandomWords(count) {
            const shuffled = [...words].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function setupMatchingGame() {
            definitionsEl.innerHTML = '';
            wordsEl.innerHTML = '';
            
            // Перемешиваем определения и слова
            const shuffledDefinitions = [...currentMatchingSet].sort(() => 0.5 - Math.random());
            const shuffledWords = [...currentMatchingSet].sort(() => 0.5 - Math.random());
            
            // Создаем элементы определений
            shuffledDefinitions.forEach((word, index) => {
                const definitionItem = document.createElement('div');
                definitionItem.className = 'definition-item';
                definitionItem.textContent = word.definition;
                definitionItem.dataset.index = index;
                definitionItem.addEventListener('click', () => selectDefinition(definitionItem));
                definitionsEl.appendChild(definitionItem);
            });
            
            // Создаем элементы слов
            shuffledWords.forEach((word, index) => {
                const wordItem = document.createElement('div');
                wordItem.className = 'word-item';
                wordItem.textContent = word.english;
                wordItem.dataset.word = word.english;
                wordItem.addEventListener('click', () => selectWord(wordItem));
                wordsEl.appendChild(wordItem);
            });
            
            // Сбрасываем выбранные элементы
            selectedDefinition = null;
            selectedWord = null;
            matchingResult.style.display = 'none';
            checkMatchingBtn.disabled = false;
            nextMatchingBtn.disabled = true;
        }

        function selectDefinition(definitionItem) {
            if (definitionItem.classList.contains('matched')) return;
            
            // Снимаем выделение со всех определений
            document.querySelectorAll('.definition-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            // Выделяем выбранное определение
            definitionItem.classList.add('selected');
            selectedDefinition = definitionItem;
            
            checkIfPaired();
        }

        function selectWord(wordItem) {
            if (wordItem.classList.contains('matched')) return;
            
            // Снимаем выделение со всех слов
            document.querySelectorAll('.word-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            // Выделяем выбранное слово
            wordItem.classList.add('selected');
            selectedWord = wordItem;
            
            checkIfPaired();
        }

        function checkIfPaired() {
            if (selectedDefinition && selectedWord) {
                checkMatching();
            }
        }

        function checkMatching() {
            if (!selectedDefinition || !selectedWord) return;
            
            const definitionIndex = parseInt(selectedDefinition.dataset.index);
            const selectedWordText = selectedWord.dataset.word;
            const correctWord = currentMatchingSet[definitionIndex].english;
            
            if (selectedWordText === correctWord) {
                // Правильное сопоставление
                selectedDefinition.classList.add('matched');
                selectedWord.classList.add('matched');
                matchedPairs++;
                
                if (matchedPairs === currentMatchingSet.length) {
                    matchingResult.textContent = "Perfect! All matches are correct!";
                    matchingResult.style.color = "#4CAF50";
                    matchingResult.style.display = 'block';
                    checkMatchingBtn.disabled = true;
                    nextMatchingBtn.disabled = false;
                }
            } else {
                // Неправильное сопоставление
                matchingResult.textContent = "Incorrect match. Try again!";
                matchingResult.style.color = "#f44336";
                matchingResult.style.display = 'block';
                
                // Снимаем выделение
                selectedDefinition.classList.remove('selected');
                selectedWord.classList.remove('selected');
                selectedDefinition = null;
                selectedWord = null;
            }
        }

        function nextMatchingSet() {
            startMatchingGame();
        }

        // Context Test functions
        function startContextTest() {
            contextWords = [...words];
            shuffleArray(contextWords);
            currentContextIndex = 0;
            score = 0;
            nextContextQuestion();
        }

        function nextContextQuestion() {
            if (currentContextIndex >= contextWords.length) {
                showContextResults();
                return;
            }

            const currentWord = contextWords[currentContextIndex];
            
            // Создаем предложение с пропуском
            const sentence = currentWord.example.replace(currentWord.english, '__________');
            contextSentence.textContent = sentence;
            
            // Генерируем варианты ответов
            const optionsArray = [currentWord.english];
            while (optionsArray.length < 4) {
                const randomWord = words[Math.floor(Math.random() * words.length)];
                if (!optionsArray.includes(randomWord.english)) {
                    optionsArray.push(randomWord.english);
                }
            }
            shuffleArray(optionsArray);
            
            // Отображаем варианты
            contextOptions.innerHTML = '';
            optionsArray.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.textContent = option;
                optionElement.addEventListener('click', () => selectContextOption(optionElement));
                contextOptions.appendChild(optionElement);
            });
            
            // Сбрасываем UI
            contextResult.style.display = 'none';
            checkContextBtn.disabled = false;
            nextContextBtn.disabled = true;
        }

        function selectContextOption(optionElement) {
            // Снимаем выделение со всех вариантов
            document.querySelectorAll('#contextOptions .option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Выделяем выбранный вариант
            optionElement.classList.add('selected');
            selectedOption = optionElement.textContent;
        }

        function checkContextAnswer() {
            if (!selectedOption) return;
            
            const currentWord = contextWords[currentContextIndex];
            const isCorrect = selectedOption === currentWord.english;
            
            // Показываем правильный/неправильный ответ
            document.querySelectorAll('#contextOptions .option').forEach(opt => {
                if (opt.textContent === currentWord.english) {
                    opt.classList.add('correct');
                } else if (opt.textContent === selectedOption && !isCorrect) {
                    opt.classList.add('incorrect');
                }
                opt.style.pointerEvents = 'none';
            });
            
            // Обновляем счет
            if (isCorrect) {
                score++;
                contextResult.textContent = "Correct!";
                contextResult.style.color = "#4CAF50";
            } else {
                contextResult.textContent = `Incorrect! The right answer is "${currentWord.english}".`;
                contextResult.style.color = "#f44336";
            }
            
            contextResult.style.display = 'block';
            checkContextBtn.disabled = true;
            nextContextBtn.disabled = false;
            currentContextIndex++;
        }

        function showContextResults() {
            contextQuestion.textContent = "Context Test Completed!";
            contextSentence.textContent = '';
            contextOptions.innerHTML = '';
            contextResult.textContent = `Your score: ${score} out of ${contextWords.length}`;
            contextResult.style.color = "#2c3e50";
            contextResult.style.display = 'block';
            checkContextBtn.style.display = 'none';
            nextContextBtn.textContent = 'Restart Test';
            nextContextBtn.onclick = () => {
                startContextTest();
                checkContextBtn.style.display = 'block';
                nextContextBtn.textContent = 'Next Question';
            };
        }

        // Utility function to shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize the application
        init();
    </script>
</body>
</html>
